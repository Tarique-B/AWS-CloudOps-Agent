version: '3.8'

services:
  # FastAPI Agent Service
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: aws-assistant-agent
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
      - LOG_LEVEL=INFO
      - BEDROCK_MODEL_ID=anthropic.claude-3-sonnet-20240229-v1:0
      # AWS credentials - pass through from host
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aws-assistant-network

  # Streamlit Chatbot Service
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: aws-assistant-chatbot
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://agent:8888
      - LOG_LEVEL=INFO
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aws-assistant-network

networks:
  aws-assistant-network:
    driver: bridge

